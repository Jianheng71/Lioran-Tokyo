<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Lioran—Tokyo local promo dialog" />
    <title>Lioran—Tokyo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#composer" data-i18n="skip">跳到输入框</a>

    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar" aria-label="会话" data-i18n-aria="sessionsAria">
        <div class="sidebar-top">
          <div class="sidebar-brand-row">
            <a class="sidebar-home" href="/" aria-label="Lioran—Tokyo">
              <img class="brand-icon" src="/brand/icon.svg" alt="" width="28" height="28" />
              <span class="sidebar-wordmark">Lioran—Tokyo</span>
            </a>
            <button
              type="button"
              class="icon-btn desktop-only"
              id="sidebar-collapse"
              aria-label="收起侧栏"
              data-i18n-aria="collapseSidebar"
              aria-controls="sidebar"
              aria-expanded="true"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  d="M4 7h16M4 12h10M4 17h16"
                />
              </svg>
            </button>
          </div>

          <button type="button" class="btn-new-chat" id="new-chat" data-i18n-title="newChat" title="新对话">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                d="M12 5v14M5 12h14"
              />
            </svg>
            <span data-i18n="newChat">新对话</span>
          </button>

          <label class="sidebar-search" for="history-search">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16.5 16.5 20 20" />
            </svg>
            <input
              id="history-search"
              type="search"
              autocomplete="off"
              data-i18n-placeholder="searchChats"
              placeholder="搜索对话"
            />
          </label>

          <p class="sidebar-label" data-i18n="yourChats">你的对话</p>
          <nav class="sidebar-list" id="session-list" aria-label="对话历史" data-i18n-aria="historyAria"></nav>
        </div>

        <footer class="sidebar-foot">
          <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language">中 / EN</button>
          <a href="/license.txt" data-i18n="license">许可</a>
          <span class="sidebar-health" id="health-chip" title="服务状态" data-i18n-title="healthTitle">检查中</span>
        </footer>
      </aside>

      <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

      <section class="main" aria-label="对话" data-i18n-aria="conversationAria">
        <header class="topbar">
          <button
            type="button"
            class="icon-btn mobile-only"
            id="sidebar-toggle"
            aria-label="打开侧栏"
            data-i18n-aria="openSidebar"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                d="M4 7h16M4 12h16M4 17h16"
              />
            </svg>
          </button>
          <div class="topbar-brand brand-lockup" aria-label="Lioran—Tokyo">
            <img class="brand-mark" src="/brand/mark.svg" alt="" width="20" height="20" />
            <span>Lioran—Tokyo</span>
          </div>
          <span class="topbar-spacer" aria-hidden="true"></span>
          <span class="topbar-mode" id="mode-chip" data-i18n="modeLocal">本地</span>
        </header>

        <div class="chat-stage" id="chat-stage">
          <div class="messages" id="scroller" role="log" aria-live="polite" aria-relevant="additions">
            <div class="empty" id="empty">
              <img class="empty-mark" src="/brand/icon.svg" alt="" width="72" height="72" />
              <h1 class="empty-title">Lioran—Tokyo</h1>
              <p class="empty-sub" data-i18n="emptySub">
                说明你要的促销片，有商品页链接也可以一并贴上。先问清楚，确认后才开始做视频。
              </p>
            </div>
            <div class="message-list" id="thread" hidden></div>
            <div id="anchor" aria-hidden="true"></div>
          </div>

          <div class="dock">
            <div class="confirm-card" id="confirm-bar" hidden>
              <p class="confirm-text" id="confirm-text"></p>
              <button type="button" class="btn btn-primary" id="confirm-btn" data-i18n="confirmStart">
                确认并开始
              </button>
            </div>

            <form class="composer-pill" id="form">
              <button
                type="button"
                class="composer-plus"
                id="composer-plus"
                aria-label="工具"
                data-i18n-aria="tools"
                title="工具"
              >
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    d="M12 5v14M5 12h14"
                  />
                </svg>
              </button>
              <label class="sr-only" for="composer" data-i18n="messageLabel">消息</label>
              <textarea
                id="composer"
                name="message"
                rows="1"
                placeholder="用这个链接做一条促销片，价格保留日元。"
                data-i18n-placeholder="composerPlaceholder"
                autocomplete="off"
              ></textarea>
              <div class="composer-rail">
                <span class="composer-tier" data-i18n="modeLocal">本地</span>
                <button type="submit" class="send-btn" id="send" aria-label="发送" data-i18n-aria="send" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M5 12h14M13 6l6 6-6 6"
                    />
                  </svg>
                </button>
              </div>
            </form>
            <p class="composer-hint" data-i18n="composerHint">Enter 发送 · Shift+Enter 换行</p>
            <p class="foot-note" data-i18n="footNote">仅用于你有权使用的页面。</p>
          </div>
        </div>
      </section>
    </div>

    <div class="plus-menu" id="plus-menu" hidden>
      <button type="button" class="plus-item" id="plus-new" data-i18n="newChat">新对话</button>
      <button type="button" class="plus-item" id="plus-lang">中 / EN</button>
      <a class="plus-item" href="/license.txt" data-i18n="license">许可</a>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
