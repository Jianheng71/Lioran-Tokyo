<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Lioran—Tokyo local promo dialog" />
    <title>Lioran—Tokyo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#composer" data-i18n="skip">跳到输入框</a>

    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar" aria-label="会话" data-i18n-aria="sessionsAria">
        <div class="sidebar-inner">
          <button type="button" class="sidebar-new" id="new-chat" title="新对话" data-i18n-title="newChat">
            <span class="brand-lockup" aria-hidden="true">
              <img class="brand-mark" src="/brand/mark.svg" alt="" width="22" height="22" />
              <span class="sidebar-brand">Lioran—Tokyo</span>
            </span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.33H5v-.92l9.06-9.06.92.92L5.92 19.58zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
              />
            </svg>
          </button>
          <p class="sidebar-label" data-i18n="yourChats">你的对话</p>
          <nav class="sidebar-list" id="session-list" aria-label="对话历史" data-i18n-aria="historyAria"></nav>
        </div>
        <footer class="sidebar-foot">
          <a href="/license.txt" data-i18n="license">许可</a>
          <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language">中 / EN</button>
          <span class="sidebar-health" id="health-chip" title="服务状态" data-i18n-title="healthTitle">检查中</span>
        </footer>
      </aside>

      <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

      <section class="main" aria-label="对话" data-i18n-aria="conversationAria">
        <header class="topbar">
          <button
            type="button"
            class="icon-btn mobile-only"
            id="sidebar-toggle"
            aria-label="打开侧栏"
            data-i18n-aria="openSidebar"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <svg class="icon" viewBox="0 0 15 15" aria-hidden="true">
              <path
                fill="currentColor"
                fill-rule="evenodd"
                d="M1.5 3a.5.5 0 0 0 0 1h12a.5.5 0 0 0 0-1h-12zM1 7.5a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 0 1h-12a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 0 1h-12a.5.5 0 0 1-.5-.5z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn desktop-only"
            id="sidebar-collapse"
            aria-label="收起侧栏"
            data-i18n-aria="collapseSidebar"
            aria-controls="sidebar"
            aria-expanded="true"
          >
            <svg class="icon" viewBox="0 0 15 15" aria-hidden="true">
              <path
                fill="currentColor"
                fill-rule="evenodd"
                d="M1.5 3a.5.5 0 0 0 0 1h12a.5.5 0 0 0 0-1h-12zM1 7.5a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 0 1h-12a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 0 1h-12a.5.5 0 0 1-.5-.5z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
          <div class="topbar-title brand-lockup" aria-label="Lioran—Tokyo">
            <img class="brand-mark" src="/brand/mark.svg" alt="" width="22" height="22" />
            <span>Lioran—Tokyo</span>
          </div>
          <span class="topbar-spacer" aria-hidden="true"></span>
        </header>

        <div class="chat-column">
          <div class="messages" id="scroller" role="log" aria-live="polite" aria-relevant="additions">
            <div class="empty" id="empty">
              <img class="empty-mark" src="/brand/icon.svg" alt="" width="64" height="64" />
              <h1 class="empty-title">Lioran—Tokyo</h1>
              <p class="empty-sub" data-i18n="emptySub">
                说明你要的促销片，有商品页链接也可以一并贴上。先问清楚，确认后才开始做视频。
              </p>
            </div>
            <div class="message-list" id="thread" hidden></div>
            <div id="anchor" aria-hidden="true"></div>
          </div>

          <div class="dock">
            <div class="confirm-card" id="confirm-bar" hidden>
              <p class="confirm-text" id="confirm-text"></p>
              <button type="button" class="btn btn-primary" id="confirm-btn" data-i18n="confirmStart">
                确认并开始
              </button>
            </div>

            <form class="composer-card" id="form">
              <label class="sr-only" for="composer" data-i18n="messageLabel">消息</label>
              <textarea
                id="composer"
                name="message"
                rows="1"
                placeholder="用这个链接做一条促销片，价格保留日元。"
                data-i18n-placeholder="composerPlaceholder"
                autocomplete="off"
              ></textarea>
              <div class="composer-actions">
                <span class="composer-hint" data-i18n="composerHint">Enter 发送 · Shift+Enter 换行</span>
                <button type="submit" class="icon-btn send" id="send" aria-label="发送" data-i18n-aria="send" disabled>
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3 12h18M13 6l6 6-6 6"
                    />
                  </svg>
                </button>
              </div>
            </form>
            <p class="foot-note" data-i18n="footNote">仅用于你有权使用的页面。</p>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
