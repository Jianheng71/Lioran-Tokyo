<template id="scene1-intro-template">
  <div
    data-composition-id="scene1-intro"
    data-width="1080"
    data-height="1920"
    data-duration="1.125"
  >
    <div class="intro-stage">
      <div class="ring"></div>
      <img
        class="brand-mark"
        data-var-src="brandMark"
        src="assets/logo.png"
        alt=""
      />
      <div class="brand-name" data-var-text="brand">Brand</div>
    </div>

    <style>
      @font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 400;
  font-display: block;
  src: url("assets/fonts/inter-latin-400.woff2") format("woff2");
}
@font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 500;
  font-display: block;
  src: url("assets/fonts/inter-latin-500.woff2") format("woff2");
}
@font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 600;
  font-display: block;
  src: url("assets/fonts/inter-latin-600.woff2") format("woff2");
}
@font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 800;
  font-display: block;
  src: url("assets/fonts/inter-latin-800.woff2") format("woff2");
}
@font-face {
  font-family: "Noto Sans SC";
  font-style: normal;
  font-weight: 400;
  font-display: block;
  src: url("assets/fonts/noto-sans-sc-400.woff2") format("woff2");
}
@font-face {
  font-family: "Noto Sans SC";
  font-style: normal;
  font-weight: 500;
  font-display: block;
  src: url("assets/fonts/noto-sans-sc-500.woff2") format("woff2");
}
@font-face {
  font-family: "Noto Sans SC";
  font-style: normal;
  font-weight: 600;
  font-display: block;
  src: url("assets/fonts/noto-sans-sc-600.woff2") format("woff2");
}
@font-face {
  font-family: "Noto Sans SC";
  font-style: normal;
  font-weight: 700;
  font-display: block;
  src: url("assets/fonts/noto-sans-sc-700.woff2") format("woff2");
}
      [data-composition-id="scene1-intro"] {
        background: var(--background, #0a0a0f);
        font-family: "Noto Sans SC", "Inter", sans-serif;
        overflow: hidden;
      }
      [data-composition-id="scene1-intro"] .intro-stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
      }
      [data-composition-id="scene1-intro"] .brand-mark {
        width: 360px;
        height: 360px;
        object-fit: contain;
        border-radius: 72px;
        position: relative;
        z-index: 2;
        transform-origin: center center;
        opacity: 1;
      }
      [data-composition-id="scene1-intro"] .ring {
        position: absolute;
        width: 420px;
        height: 420px;
        border: 4px solid #ffffff;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        margin: -210px 0 0 -210px;
        opacity: 0;
        pointer-events: none;
        z-index: 1;
      }
      [data-composition-id="scene1-intro"] .brand-name {
        color: #ffffff;
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.03em;
        text-align: center;
        z-index: 2;
        font-family: "Noto Sans SC", "Inter", sans-serif;
      }
    </style>

    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const root = '[data-composition-id="scene1-intro"]';
        const mark = root + " .brand-mark";
        const name = root + " .brand-name";
        const ring = root + " .ring";

        // Logo + brand name are authored visible on frame 0 (social thumbnail).
        gsap.set(ring, { scale: 0.2, opacity: 0 });

        tl.fromTo(mark, { scale: 0.92 }, { scale: 1, duration: 0.5, ease: "back.out(1.2)" }, 0);
        tl.fromTo(
          ring,
          { scale: 0.3, opacity: 0.9 },
          { scale: 1.8, opacity: 0, duration: 0.45, ease: "power2.out" },
          0.25,
        );
        tl.to(name, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.45);
        tl.to(
          [mark, name],
          { opacity: 0, scale: 0.92, duration: 0.2, ease: "power2.in" },
          0.92,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["scene1-intro"] = tl;
      })();
    </script>
  </div>
</template>
